<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MT5 Control</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:12px}
.card{background:#161616;border:1px solid #222;border-radius:14px;padding:14px;margin-bottom:12px}
.green{color:#00ff88;font-weight:700}.gold{color:#ffcc00;font-weight:700}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:13px}
.btn{width:48%;padding:14px;border-radius:10px;border:0;font-weight:800;font-size:14px}
.start{background:#00ff88;color:#000}.stop{background:#ff3333;color:#fff}
#chart{height:70px;width:100%;background:#111;border-radius:8px;position:relative}
.line{position:absolute;bottom:20px;left:0;right:0;height:2px;background:#ffcc00;clip-path:polygon(0% 80%,10% 60%,20% 70%,30% 30%,40% 40%,50% 20%,60% 50%,70% 35%,80% 60%,90% 40%,100% 30%)}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between"><span class="green">● CONNECTED</span><span style="font-size:11px;opacity:.6">Connected to Exness</span></div>
<div class="card"><div style="display:flex;justify-content:space-between"><span class="gold">◫ MT5 ACCOUNT</span><span style="border:1px solid #ffcc00;color:#ffcc00;padding:2px 8px;border-radius:20px;font-size:11px">● Live</span></div>
<div class="row"><span>Broker</span><span>Exness</span></div><div class="row"><span>Login</span><span>56197382</span></div><div class="row"><span>Server</span><span>Exness-Real23</span></div><div class="row"><span>Account type</span><span>Live</span></div></div>
<div class="card"><div class="gold">📈 LIVE ANALYSIS</div><div id="chart"><div class="line"></div></div>
<div style="font-size:12px;line-height:22px;margin-top:8px"><div>● Detecting market</div><div>● Calibrating stop loss</div><div>● AI scoring</div><div style="opacity:.6">Elite Bot is monitoring your live account</div><div id="price" style="font-weight:700;margin-top:6px">-- XAUUSD</div><div id="equity">Balance: $20 → Equity: $20</div></div></div>
<div class="card"><div class="gold">🤖 BOT CONTROL</div><div class="row"><span>Bot Status</span><span id="status" style="color:#888">● Stopped</span></div>
<div style="display:flex;gap:4%;margin-top:10px"><button class="btn start" onclick="fetch('/api/start',{method:'POST'})">▶ START BOT</button><button class="btn stop" onclick="fetch('/api/stop',{method:'POST'})">■ STOP BOT</button></div><div id="log" style="margin-top:10px;font-size:11px;opacity:.7;max-height:120px;overflow:auto"></div></div>
<script>async function upd(){let r=await fetch('/api/bot');let j=await r.json();document.getElementById('price').innerText='$'+j.price+' XAUUSD - '+j.signal;document.getElementById('equity').innerText='Balance: $'+j.balance+' → Equity: $'+j.equity+' | Trades: '+j.tradesCount+'x 0.01 | '+j.mode;document.getElementById('status').innerText=j.running?'● Running':'● Stopped';document.getElementById('status').style.color=j.running?'#00ff88':'#888';if(j.log)document.getElementById('log').innerHTML='<div>'+j.log+'</div>'+document.getElementById('log').innerHTML}setInterval(upd,2000);upd()</script>
</body>
</html>
