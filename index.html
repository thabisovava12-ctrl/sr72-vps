<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD BOT V28.1 VIDEO 0.01</title>
<style>body{background:#0f0f0f;color:#fff;font-family:Arial;padding:10px} .card{background:#1e1e1e;border-radius:12px;padding:12px;margin:8px 0} button{width:100%;padding:14px;border-radius:10px;border:0;font-weight:bold;margin:6px 0} .buy{background:#00c853} .sell{background:#ff3d00} .trail{color:#00e676;font-size:12px}</style>
</head>
<body>
<h2>GOLD BOT V28.1 VIDEO CLONE — 0.01 FIXED</h2>
<div class="card">Balance: <span id="bal">-</span> | Price: <span id="price">-</span></div>
<div class="card"><button class="buy" onclick="start()">START STRADDLE REAL (2.00 / SL 2.50 / TRAIL)</button><button class="sell" onclick="closeAll()">CLOSE ALL</button></div>
<div class="card">Orders: <pre id="orders">-</pre></div>
<div class="card">Positions: <pre id="pos">-</pre></div>
<div class="card trail">Trailing Logs: <pre id="trail">waiting...</pre></div>
<script>
async function loadBal(){let r=await fetch('/api/balance');let j=await r.json();document.getElementById('bal').innerText=(j.balance||JSON.stringify(j)).toString().slice(0,100)}
async function loadPrice(){let r=await fetch('/api/price');let j=await r.json();document.getElementById('price').innerText=(j.bid+' / '+j.ask)}
async function loadOrders(){let r=await fetch('/api/orders');let t=await r.text();document.getElementById('orders').innerText=t.slice(0,2000)}
async function loadPos(){let r=await fetch('/api/positions');let t=await r.text();document.getElementById('pos').innerText=t.slice(0,2000)}
async function start(){let r=await fetch('/api/start_straddle',{method:'POST'});let j=await r.json();alert(JSON.stringify(j))}
async function closeAll(){await fetch('/api/close_all',{method:'POST'});alert('closed')}
async function doTrail(){let r=await fetch('/api/trail',{method:'POST'});let j=await r.json();if(j.logs&&j.logs.length)document.getElementById('trail').innerText=j.logs.join('\n')+'\n'+j.bid+'/'+j.ask}
setInterval(loadPrice,2000);setInterval(loadOrders,3000);setInterval(loadPos,3000);setInterval(doTrail,2000);
loadBal();loadPrice();loadOrders();loadPos();
</script>
</body>
</html>
