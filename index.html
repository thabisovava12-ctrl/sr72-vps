<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SR72</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px;margin:0}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:12px;padding:14px;margin:10px 0}
button{width:100%;padding:15px;border-radius:10px;border:0;font-weight:bold;font-size:16px;cursor:pointer}
.start{background:#00ff88;color:#000}
.test{background:#222;color:#fff;margin-top:8px;border:1px solid #333}
h1{color:#00ff88;font-size:20px;margin:10px 0}
small{color:#888}
b{color:#fff}
#status{font-size:13px;margin-top:8px}
</style>
</head>
<body>
<h1>SR72 GOLD BOT - REAL</h1>

<div class="card">
Balance: <b id="bal">Loading...</b><br>
Gold: <b id="price">Loading...</b> <small id="spread"></small>
<div id="status">Ready - Lot 0.01 Straddle $0.80 (same as demo tested)</div>
</div>

<button class="start" onclick="startStraddle()">START STRADDLE BOT (REAL)</button>
<button class="test" onclick="testBuy()">TEST BUY 0.01 (the one that gave order 483939556)</button>

<div class="card">
<b>Live from Exness MT5:</b>
<pre id="live" style="white-space:pre-wrap;font-size:11px;color:#aaa">Loading positions...</pre>
</div>

<div class="card">
<b>Last Action:</b>
<pre id="last" style="white-space:pre-wrap;font-size:11px;color:#00ff88">-</pre>
</div>

<script>
async function load(){
 try{
  let b=await fetch('/api/balance').then(r=>r.json());
  document.getElementById('bal').innerText='$'+(b.balance||b.equity||'?').toFixed?.(2)||b.balance;
  let p=await fetch('/api/price').then(r=>r.json());
  document.getElementById('price').innerText=p.bid+' / '+p.ask;
  document.getElementById('spread').innerText=' spread '+(p.ask-p.bid).toFixed(2);
  let pos=await fetch('/api/positions').then(r=>r.text());
  document.getElementById('live').innerText=pos.substring(0,2000);
 }catch(e){}
}
async function startStraddle(){
 document.getElementById('status').innerText='Placing REAL straddle $0.80...';
 let r=await fetch('/api/start_straddle',{method:'POST'}).then(r=>r.json());
 document.getElementById('last').innerText=JSON.stringify(r,null,2);
 document.getElementById('status').innerText=`DONE! BuyStop $${r.buy_stop} SellStop $${r.sell_stop} - Check MT5 app!`;
 load();
}
async function testBuy(){
 document.getElementById('status').innerText='Placing TEST BUY...';
 let r=await fetch('/api/test_trade').then(r=>r.text());
 document.getElementById('last').innerText=r.substring(0,2000);
 document.getElementById('status').innerText='BUY DONE - Check Exness!';
 load();
}
load(); setInterval(load,5000);
</script>
</body>
</html>
