<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR-72 DARK STAR</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}
.card{background:#151515;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #222}
.badge{padding:4px 10px;border-radius:20px;font-weight:bold}
.sell{background:#ff2a2a22;color:#ff4a4a;border:1px solid #ff4a4a}
.buy{background:#00ff8822;color:#00ff88;border:1px solid #00ff88}
.conf{float:right;background:#00ff8844;padding:5px 12px;border-radius:20px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.box{background:#1e1e1e;padding:8px;border-radius:8px}
</style>
</head>
<body>
<h3>SR-72 DARK STAR <span style="color:#00ff88">AI CHART • AUTO-DETECT</span> <span id="liveTop" style="float:right;color:#ffaa00"></span></h3>
<input type="file" id="img" accept="image/*" style="margin:10px 0">
<div id="status"></div>
<div id="out"></div>

<script>
document.getElementById('img').onchange = async (e)=>{
  const f=e.target.files[0]; if(!f) return;
  document.getElementById('status').innerHTML = `✓ LOCKED: ${f.name} • ${(f.size/1024).toFixed(0)}KB<br>✅ AUTO-DETECTED: Scanning...`;
  let fd=new FormData(); fd.append('image',f); fd.append('symbol','XAUUSDc');
  let r=await fetch('/api/scan_image',{method:'POST',body:fd});
  let j=await r.json();
  if(j.error){ document.getElementById('status').innerHTML=j.error; return; }
  document.getElementById('status').innerHTML = `✓ LOCKED: ${f.name}<br>✅ AUTO-DETECTED: ${j.symbol} • Fixed to lowercase c • Ready`;
  document.getElementById('liveTop').innerHTML = `LIVE ${j.live}`;
  let agg=j.aggressive;
  document.getElementById('out').innerHTML = `
  <div class="card">
    <div><b>SR-72 DARK STAR • ${j.symbol} • AUTO-DETECTED</b> <span class="conf">CONFIDENCE ${j.confidence}%</span></div>
    <h3>Structured Analysis</h3>
    <div class="badge sell">Trend • SR-72 <span style="margin-left:10px" class="badge sell">M1 ${j.mtf.m1}</span> <span class="badge sell">M5 ${j.mtf.m5}</span> <span class="badge sell">M15 ${j.mtf.m15}</span></div>
    <p style="color:#aaa;font-size:13px">${j.trend}</p>
    <div class="grid">
      <div class="box">Live Market<br><b style="color:#ffaa00">${j.live}</b></div>
      <div class="box">EMA 9 M1<br><b>${j.ema9?.toFixed(2)}</b></div>
      <div class="box">EMA 21 M1<br><b>${j.ema21?.toFixed(2)}</b></div>
      <div class="box">EMA 50 M1<br><b>${j.ema50?.toFixed(2)}</b></div>
      <div class="box">High / Low<br><b>H ${j.period_high?.toFixed(2)} / L ${j.period_low?.toFixed(2)}</b></div>
      <div class="box">Vision<br><b style="color:#00ff88">${j.mtf.img} ${j.confidence>=80?'LOCKED':''}</b></div>
    </div>
  </div>
  <div class="card">
    <div>AGGRESSIVE • Market <span style="float:right" class="badge sell">${agg.side} ${agg.symbol}</span></div>
    <hr>
    ENTRY @ MARKET<br><b style="color:#ffaa00">${agg.entry_low} - ${agg.entry_high} @ ${agg.entry_mid}</b><br><br>
    STOP LOSS<br><b style="color:#ff4a4a">${agg.sl}</b><br><br>
    TAKE PROFIT<br><b style="color:#00ff88">${agg.tp1}, ${agg.tp2}</b><br><br>
    <button onclick="enter()" style="width:100%;padding:12px;background:#00ff88;border:none;border-radius:8px;font-weight:bold">EXECUTE ${agg.side}</button>
  </div>`;
  window._plan=j.aggressive;
}
async function enter(){
  let r=await fetch('/api/sniper/enter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:window._plan})});
  alert('ORDER PLACED: '+JSON.stringify(await r.json()));
}
</script>
</body>
</html>
